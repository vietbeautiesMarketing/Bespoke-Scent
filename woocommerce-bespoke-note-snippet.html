     Website chính: https://vietbeauties.vn/
     ==========================================================================

     CÁCH 1 (KHUYÊN DÙNG — KHÔNG CẦN SỬA CODE THEME):
     1. Đăng nhập WordPress Admin của vietbeauties.vn
     2. Vào Flatsome -> Theme Options -> Global Settings -> Footer Scripts
        (hoặc WPCode / Insert Headers and Footers -> mục Footer)
     3. Dán toàn bộ đoạn <script>...</script> bên dưới rồi bấm Lưu (Save).
     ========================================================================== -->

<script>
(function () {
  var STORAGE_KEY = "miyako_bespoke_note";
  var TTL_MS = 7 * 24 * 60 * 60 * 1000; // Hết hạn sau 7 ngày
  var CUSTOM_PRODUCT_KEYWORDS = [
    "tinh-dau-khuech-tan-custome",
    "custome",
    "custom",
  ];

  // 1. Bắt ?bespoke_note=... khi khách chuyển từ Mini Game sang vietbeauties.vn
  try {
    var params = new URLSearchParams(window.location.search);
    var incomingNote = params.get("bespoke_note");
    if (incomingNote && incomingNote.trim()) {
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify({
          note: incomingNote.trim(),
          savedAt: Date.now(),
        })
      );
    }
  } catch (e) {}

  // 2. Xóa ghi chú tạm khi khách đã hoàn tất đặt hàng (trang Cảm ơn / order-received)
  if (
    window.location.href.indexOf("order-received") !== -1 ||
    (document.body && document.body.classList.contains("woocommerce-order-received"))
  ) {
    try {
      localStorage.removeItem(STORAGE_KEY);
    } catch (e) {}
    return;
  }

  // 3. Kiểm tra đơn hàng đang thanh toán có chứa sản phẩm Custom hay không
  function checkoutHasCustomProduct() {
    var productCells = document.querySelectorAll(
      '#order_review .cart_item .product-name, .woocommerce-checkout-review-order-table .cart_item .product-name, .woocommerce-checkout-review-order-table td.product-name'
    );
    if (!productCells || productCells.length === 0) return false;

    for (var i = 0; i < productCells.length; i++) {
      var cell = productCells[i];
      var text = (cell.textContent || "").toLowerCase();
      var anchor = cell.querySelector ? cell.querySelector("a[href]") : null;
      var href = anchor ? (anchor.getAttribute("href") || "").toLowerCase() : "";

      for (var k = 0; k < CUSTOM_PRODUCT_KEYWORDS.length; k++) {
        var kw = CUSTOM_PRODUCT_KEYWORDS[k];
        if (text.indexOf(kw) !== -1 || href.indexOf(kw) !== -1) {
          return true;
        }
      }
    }
    return false;
  }

  // 4. Chỉ điền vào ô "Ghi chú đơn hàng (tuỳ chọn)" khi đơn có sản phẩm Custom
  function fillCheckoutOrderNote() {
    var textarea =
      document.getElementById("order_comments") ||
      document.querySelector('textarea[name="order_comments"]');
    if (!textarea) return;

    var raw = null;
    try {
      raw = localStorage.getItem(STORAGE_KEY);
    } catch (e) {}
    if (!raw) return;

    try {
      var parsed = JSON.parse(raw);
      if (!parsed || !parsed.note) return;
      if (parsed.savedAt && Date.now() - parsed.savedAt > TTL_MS) {
        localStorage.removeItem(STORAGE_KEY);
        return;
      }

      var hasCustom = checkoutHasCustomProduct();

      if (hasCustom) {
        // Chỉ điền khi ô ghi chú đang trống (tránh ghi đè nội dung khách tự sửa)
        if (!textarea.value.trim()) {
          textarea.value = parsed.note;
          textarea.dataset.miyakoAutofilled = "1";
          textarea.dispatchEvent(new Event("input", { bubbles: true }));
          textarea.dispatchEvent(new Event("change", { bubbles: true }));
        }
      } else if (
        textarea.dataset.miyakoAutofilled === "1" &&
        textarea.value.trim() === parsed.note.trim()
      ) {
        // Nếu khách bỏ sản phẩm Custom khỏi giỏ hàng và giữ SP khác, xóa ghi chú đã tự điền
        textarea.value = "";
        delete textarea.dataset.miyakoAutofilled;
        textarea.dispatchEvent(new Event("input", { bubbles: true }));
        textarea.dispatchEvent(new Event("change", { bubbles: true }));
      }
    } catch (e) {}
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", fillCheckoutOrderNote);
  } else {
    fillCheckoutOrderNote();
  }

  // Đảm bảo đồng bộ lại khi WooCommerce cập nhật khu vực thanh toán bằng AJAX
  if (window.jQuery) {
    window.jQuery(document.body).on("updated_checkout", fillCheckoutOrderNote);
  }
})();
</script>
